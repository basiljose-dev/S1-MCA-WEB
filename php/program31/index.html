<!DOCTYPE html>
<html>
<head>
    <title>Employee Management System</title>
</head>
<body>

    <h2>Add Employee Records</h2>

    <form action="insert.php" method="POST">
        Employee ID: <input type="text" name="emp_id" required><br><br>

        Full Name: <input type="text" name="name" required><br><br>

        Department: <input type="text" name="department" required><br><br>

        Designation: <input type="text" name="designation" required><br><br>

        Salary: <input type="number" step="0.01" name="salary" required><br><br>

        <input type="submit" value="Save Employee">
    </form>

    <br>

    <h2>Search Employee</h2>

    <form action="search.php" method="GET">
        Enter Employee ID:
        <input type="text" name="search_query" required>

        <input type="submit" value="Search">
    </form>

    <br>

    <a href="view_all.php">View All Employees</a>

</body>
</html>
